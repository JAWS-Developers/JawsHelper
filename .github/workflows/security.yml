name: PR Security Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # Code scanning uploads require Advanced Security, which is not enabled.
          upload: never
          output: results

      - name: Save CodeQL results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codeql-results
          path: results/*.sarif
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    # For private repositories, enable Dependency graph and GitHub Code Security,
    # then set the repository variable DEPENDENCY_REVIEW_ENABLED to true.
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.repository.private || vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
